<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sprout · Back office</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="bo">
  <header class="bo-top">
    <div class="bo-brand">🌱 Sprout <span>Back office</span></div>
    <div class="bo-top-actions" id="topActions" hidden>
      <a class="btn ghost sm" href="../app/" target="_blank" rel="noopener">Open app ↗</a>
      <button class="btn ghost sm" id="logoutBtn">Log out</button>
    </div>
  </header>

  <!-- Login -->
  <section class="bo-card login" id="loginView">
    <h2>Staff sign in</h2>
    <p class="muted tiny">Sign in with the email &amp; password created for you in Supabase → Authentication.</p>
    <label class="label">Email</label>
    <input class="field" id="email" type="email" autocomplete="username" placeholder="you@company.com">
    <label class="label mt12">Password</label>
    <input class="field" id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn primary mt16" id="loginBtn">Sign in</button>
    <div class="bo-msg" id="loginMsg" hidden></div>
  </section>

  <!-- Product manager -->
  <section id="managerView" hidden>
    <div class="bo-bar">
      <div><b>Loan products</b><div class="tiny muted" id="countLabel">—</div></div>
      <button class="btn primary sm" id="addBtn">+ Add product</button>
    </div>
    <div class="bo-msg" id="listMsg" hidden></div>
    <div id="list"></div>
  </section>

  <!-- Edit / add form (overlay) -->
  <div class="bo-overlay" id="overlay" hidden>
    <form class="bo-sheet" id="form" autocomplete="off">
      <div class="bo-sheet-head">
        <b id="formTitle">Edit product</b>
        <button type="button" class="bo-x" id="closeForm" aria-label="Close">✕</button>
      </div>
      <input type="hidden" id="f_id">
      <label class="label">Product name *</label>
      <input class="field" id="f_name" required maxlength="60">

      <div class="bo-row">
        <div style="flex:2"><label class="label">Badge text</label><input class="field" id="f_tag" maxlength="20" placeholder="Popular"></div>
        <div style="flex:1"><label class="label">Badge colour</label>
          <select class="field" id="f_tag_class">
            <option value="ghost">Grey</option>
            <option value="lime">Green</option>
            <option value="info">Blue</option>
            <option value="amber">Amber</option>
            <option value="ok">OK green</option>
          </select>
        </div>
      </div>

      <label class="label">Short description</label>
      <input class="field" id="f_description" maxlength="80" placeholder="Unsecured · ฿20k–฿2M · 6–60 mo">

      <div class="bo-row">
        <div style="flex:1"><label class="label">Stat 1 label</label><input class="field" id="f_s1l" maxlength="16" placeholder="EIR from"></div>
        <div style="flex:1"><label class="label">Stat 1 value</label><input class="field" id="f_s1v" maxlength="12" placeholder="15.99%"></div>
      </div>
      <div class="bo-row">
        <div style="flex:1"><label class="label">Stat 2 label</label><input class="field" id="f_s2l" maxlength="16" placeholder="Max term"></div>
        <div style="flex:1"><label class="label">Stat 2 value</label><input class="field" id="f_s2v" maxlength="12" placeholder="60 mo"></div>
      </div>

      <div class="bo-row">
        <div style="flex:1"><label class="label">Display order</label><input class="field" id="f_sort" type="number" inputmode="numeric" value="0"></div>
        <label class="bo-check"><input type="checkbox" id="f_featured"> Highlight stat 1</label>
        <label class="bo-check"><input type="checkbox" id="f_active" checked> Visible in app</label>
      </div>

      <div class="bo-sheet-foot">
        <button type="button" class="btn ghost danger" id="deleteBtn" hidden>Delete</button>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </div>
      <div class="bo-msg" id="formMsg" hidden></div>
    </form>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="../app/config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
